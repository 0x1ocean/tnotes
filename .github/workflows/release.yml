name: Release
on:
  push:
    tags: ["v*"]
  # Manual run on any ref: rebuilds and re-uploads the assets of the version in Cargo.toml.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: the tag matches Cargo.toml, the suite is green, the GitHub release exists.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Tag must match Cargo.toml version
        id: version
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="tnotes") | .version')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=${GITHUB_REF_NAME#v}
            [ "$tag" = "$version" ] || { echo "tag v$tag != Cargo.toml $version"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --manifest-path vendor/edtui/Cargo.toml --lib

      - name: Release notes from CHANGELOG.md
        run: |
          set -eu
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "no CHANGELOG section for $VERSION"; exit 1; }
          printf '\n**Full changelog**: https://github.com/%s/compare/v%s...v%s\n' \
            "$GITHUB_REPOSITORY" "$(git describe --tags --abbrev=0 "v$VERSION^" | sed s/^v//)" "$VERSION" >> "$RUNNER_TEMP/notes.md" || true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --title "tnotes $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # One tarball per target, attached to the release created above.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
            test: true
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.setup
        run: ${{ matrix.setup }}
      - if: matrix.test
        run: cargo test
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          name="tnotes-$VERSION-${{ matrix.target }}"
          mkdir -p "$RUNNER_TEMP/$name"
          cp "target/${{ matrix.target }}/release/tnotes" README.md LICENSE CHANGELOG.md "$RUNNER_TEMP/$name/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ASSET=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_ENV"

      # Never overwrite a published asset: builds are not byte-reproducible, and the
      # Homebrew formula pins the checksum of the first upload.
      - name: Upload (only if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name=$(basename "$ASSET")
          if gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx "$name"; then
            echo "$name already published; keeping it"
          else
            gh release upload "v$VERSION" "$ASSET" "$ASSET.sha256"
          fi

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish edtui-tnotes if its version is new
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          v=$(cargo metadata --no-deps --manifest-path vendor/edtui/Cargo.toml --format-version 1 | jq -r '.packages[0].version')
          if curl -sf -A "tnotes-release (github.com/$GITHUB_REPOSITORY)" \
               "https://crates.io/api/v1/crates/edtui-tnotes/$v" >/dev/null; then
            echo "edtui-tnotes $v already published"
          else
            (cd vendor/edtui && cargo publish)
          fi

      - name: Publish tnotes if its version is new
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          v=${{ needs.check.outputs.version }}
          if curl -sf -A "tnotes-release (github.com/$GITHUB_REPOSITORY)" \
               "https://crates.io/api/v1/crates/tnotes/$v" >/dev/null; then
            echo "tnotes $v already published"
          else
            cargo publish
          fi

  # Regenerate the Homebrew formula from the uploaded tarballs and push it to the tap.
  homebrew:
    needs: [check, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Formula
        run: scripts/brew-formula.sh "${{ needs.check.outputs.version }}" > "$RUNNER_TEMP/tnotes.rb"
      - name: Install from the generated formula
        run: |
          set -eu
          brew tap-new --no-git local/check
          cp "$RUNNER_TEMP/tnotes.rb" "$(brew --repository local/check)/Formula/tnotes.rb"
          brew install local/check/tnotes
          tnotes --version
          brew test local/check/tnotes
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          [ -n "$GH_TOKEN" ] || { echo "HOMEBREW_TAP_TOKEN not set; skipping tap update"; exit 0; }
          v=${{ needs.check.outputs.version }}
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/0x1ocean/homebrew-tnotes.git" "$RUNNER_TEMP/tap"
          cp "$RUNNER_TEMP/tnotes.rb" "$RUNNER_TEMP/tap/Formula/tnotes.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "tnotes-release"
          git config user.email "release@tnotes.invalid"
          git add Formula/tnotes.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -qm "tnotes $v"
          git push -q
