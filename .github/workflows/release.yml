name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Tag must match Cargo.toml version
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="tnotes") | .version')
          tag=${GITHUB_REF_NAME#v}
          [ "$tag" = "$version" ] || { echo "tag v$tag != Cargo.toml $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --manifest-path vendor/edtui/Cargo.toml --lib
      - run: cargo build --release

      - name: Release notes from CHANGELOG.md
        run: |
          set -eu
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG section for $VERSION"; exit 1; }
          printf '\n**Full changelog**: https://github.com/%s/compare/v%s...v%s\n' \
            "$GITHUB_REPOSITORY" "$(git describe --tags --abbrev=0 "v$VERSION^" | sed s/^v//)" "$VERSION" >> notes.md || true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp target/release/tnotes "tnotes-$VERSION-x86_64-linux"
          gh release create "v$VERSION" "tnotes-$VERSION-x86_64-linux" \
            --title "tnotes $VERSION" --notes-file notes.md

      - name: Publish edtui-tnotes if its version is new
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          v=$(cargo metadata --no-deps --manifest-path vendor/edtui/Cargo.toml --format-version 1 | jq -r '.packages[0].version')
          if curl -sf -A "tnotes-release (github.com/$GITHUB_REPOSITORY)" \
               "https://crates.io/api/v1/crates/edtui-tnotes/$v" >/dev/null; then
            echo "edtui-tnotes $v already published"
          else
            (cd vendor/edtui && cargo publish)
          fi

      - name: Publish tnotes
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
