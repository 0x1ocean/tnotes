[package]
name = "tnotes"
version = "1.0.0"
edition = "2024"
description = "Minimal Markdown notes in the terminal: folders, tags, tabs, live highlighting, mouse-first"
license = "MIT"
repository = "https://github.com/0x1ocean/tnotes"
readme = "README.md"
keywords = ["notes", "markdown", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "text-editors"]
rust-version = "1.98"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
edtui = { package = "edtui-tnotes", version = "0.11.7", path = "vendor/edtui", default-features = false, features = ["mouse-support", "arboard"] }
notify = "8"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tui-markdown = { version = "0.3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
